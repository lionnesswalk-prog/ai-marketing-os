name: Production Smoke

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_APP_URL_OVERRIDE: ${{ vars.PRODUCTION_APP_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Request Vercel trusted-source OIDC token
        uses: actions/github-script@v7
        id: vercel-oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Check production health
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}
        run: |
          set -euo pipefail
          base="${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}"
          base="${base%/}"
          headers=(-H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN")
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
            headers+=(-H "x-vercel-set-bypass-cookie: true")
          fi

          for attempt in $(seq 1 12); do
            meta="$(curl -L --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/health-body -w '%{http_code}|%{url_effective}|%{content_type}' "$base/api/health" || true)"
            code="${meta%%|*}"
            rest="${meta#*|}"
            effective="${rest%%|*}"
            content_type="${rest#*|}"

            effective_path="$(python3 -c 'import sys; from urllib.parse import urlsplit; print(urlsplit(sys.argv[1]).path)' "$effective")"
            if [ "$effective_path" = "/signin" ]; then
              echo "Vercel Deployment Protection still rejected GitHub trusted-source OIDC at $effective."
              exit 1
            fi

            if [ "$code" = "200" ] && python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data.get("ok") is True; assert data.get("service") == "ai-marketing-os"' /tmp/health-body 2>/dev/null; then
              echo "Production health passed: $effective"
              cat /tmp/health-body
              exit 0
            fi

            echo "Health attempt $attempt/12: code=$code effective=$effective content-type=$content_type"
            head -c 160 /tmp/health-body 2>/dev/null | tr '\n' ' ' || true
            echo
            sleep 10
          done
          exit 1

      - name: Check public authentication pages
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}
        run: |
          set -euo pipefail
          base="${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}"
          base="${base%/}"
          headers=(-H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN")
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
            headers+=(-H "x-vercel-set-bypass-cookie: true")
          fi
          curl -L --fail-with-body --silent --show-error --max-time 30 "${headers[@]}" "$base/login" | grep -q "Welcome back"
          curl -L --fail-with-body --silent --show-error --max-time 30 "${headers[@]}" "$base/signup" | grep -Eq "Create|account|workspace"

      - name: Verify protected workspace route
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}
        run: |
          set -euo pipefail
          base="${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}"
          base="${base%/}"
          headers=(-H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN")
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
            headers+=(-H "x-vercel-set-bypass-cookie: true")
          fi
          code="$(curl -L --silent --show-error --max-time 30 "${headers[@]}" -o /tmp/protected.html -w '%{http_code}' "$base/operations")"
          test "$code" = "200"
          grep -Eq "Welcome back|SECURE ACCESS|login" /tmp/protected.html
