name: Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PRODUCTION_APP_URL_OVERRIDE: ${{ vars.PRODUCTION_APP_URL }}
    steps:
      - name: Wait for production health
        run: |
          set -euo pipefail
          base="${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}"
          base="${base%/}"
          for attempt in $(seq 1 18); do
            meta="$(curl -L --silent --show-error --max-time 20 -o /tmp/health-body -w '%{http_code}|%{url_effective}|%{content_type}' "$base/api/health" || true)"
            code="${meta%%|*}"
            rest="${meta#*|}"
            effective="${rest%%|*}"
            content_type="${rest#*|}"
            if [ "$code" = "200" ] && python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data.get("ok") is True; assert data.get("service") == "ai-marketing-os"' /tmp/health-body 2>/dev/null; then
              echo "Production health passed: $effective"
              cat /tmp/health-body
              exit 0
            fi
            echo "Health attempt $attempt/18: code=$code effective=$effective content-type=$content_type"
            head -c 160 /tmp/health-body 2>/dev/null | tr '\n' ' ' || true
            echo
            sleep 10
          done
          exit 1

      - name: Check public authentication pages
        run: |
          set -euo pipefail
          base="${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}"
          base="${base%/}"
          curl -L --fail-with-body --silent --show-error --max-time 30 "$base/login" | grep -q "Welcome back"
          curl -L --fail-with-body --silent --show-error --max-time 30 "$base/signup" | grep -Eq "Create|account|workspace"

      - name: Verify protected workspace route
        run: |
          set -euo pipefail
          base="${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}"
          base="${base%/}"
          code="$(curl -L --silent --show-error --max-time 30 -o /tmp/protected.html -w '%{http_code}' "$base/operations")"
          test "$code" = "200"
          grep -Eq "Welcome back|SECURE ACCESS|login" /tmp/protected.html
