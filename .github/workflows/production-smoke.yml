name: Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PRODUCTION_APP_URL_OVERRIDE: ${{ vars.PRODUCTION_APP_URL }}
    steps:
      - name: Wait for production health
        run: |
          set -euo pipefail
          base="${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}"
          base="${base%/}"
          for attempt in $(seq 1 30); do
            if body="$(curl -L --fail-with-body --silent --show-error --max-time 20 "$base/api/health" 2>/tmp/health-error)"; then
              if echo "$body" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("service") == "ai-marketing-os"'; then
                echo "$body"
                exit 0
              fi
            fi
            echo "Production health not ready yet (attempt $attempt/30)."
            sleep 10
          done
          cat /tmp/health-error || true
          exit 1

      - name: Check public authentication pages
        run: |
          set -euo pipefail
          base="${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}"
          base="${base%/}"
          curl -L --fail-with-body --silent --show-error --max-time 30 "$base/login" | grep -q "Welcome back"
          curl -L --fail-with-body --silent --show-error --max-time 30 "$base/signup" | grep -Eq "Create|account|workspace"

      - name: Verify protected workspace route
        run: |
          set -euo pipefail
          base="${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}"
          base="${base%/}"
          code="$(curl -L --silent --show-error --max-time 30 -o /tmp/protected.html -w "%{http_code}" "$base/operations")"
          test "$code" = "200"
          grep -Eq "Welcome back|SECURE ACCESS|login" /tmp/protected.html
