name: Social Scheduler

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/social-scheduler.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: social-scheduler
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SCHEDULER_APP_URL_OVERRIDE: ${{ vars.SCHEDULER_APP_URL }}
      PRODUCTION_APP_URL_OVERRIDE: ${{ vars.PRODUCTION_APP_URL }}
    steps:
      - name: Resolve production scheduler origin
        id: target
        run: |
          set -euo pipefail
          base="${SCHEDULER_APP_URL_OVERRIDE:-${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}}"
          base="${base%/}"
          effective="$(curl -L --silent --show-error --max-time 30 -o /tmp/scheduler-health -w '%{url_effective}' "$base/api/health")"
          origin="$(python3 -c 'import sys; from urllib.parse import urlsplit; u=urlsplit(sys.argv[1]); assert u.scheme == "https" and u.netloc; print(f"{u.scheme}://{u.netloc}")' "$effective")"
          if [ -z "$SCHEDULER_APP_URL_OVERRIDE" ] && [ -z "$PRODUCTION_APP_URL_OVERRIDE" ]; then
            host="$(python3 -c 'import sys; from urllib.parse import urlsplit; print(urlsplit(sys.argv[1]).hostname or "")' "$origin")"
            case "$host" in
              *.vercel.app) ;;
              *) echo "Unexpected scheduler redirect host: $host"; exit 1 ;;
            esac
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ai-marketing-os-scheduler")"
          token="$(echo "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run social publisher
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SCHEDULER_ORIGIN: ${{ steps.target.outputs.origin }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 55 -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "X-Scheduler-Source: github-actions-oidc" "$SCHEDULER_ORIGIN/api/scheduler/publish-social"
