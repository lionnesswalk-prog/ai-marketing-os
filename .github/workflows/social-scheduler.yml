name: Social Scheduler

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/social-scheduler.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: social-scheduler
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SCHEDULER_APP_URL_OVERRIDE: ${{ vars.SCHEDULER_APP_URL }}
      PRODUCTION_APP_URL_OVERRIDE: ${{ vars.PRODUCTION_APP_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Resolve production scheduler origin
        id: target
        run: |
          set -euo pipefail
          base="${SCHEDULER_APP_URL_OVERRIDE:-${PRODUCTION_APP_URL_OVERRIDE:-https://ai-marketing-os.vercel.app}}"
          base="${base%/}"
          headers=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
            headers+=(-H "x-vercel-set-bypass-cookie: true")
          fi

          effective="$(curl -L --silent --show-error --max-time 30 "${headers[@]}" -o /tmp/scheduler-health -w '%{url_effective}' "$base/api/health")"
          effective_path="$(python3 -c 'import sys; from urllib.parse import urlsplit; print(urlsplit(sys.argv[1]).path)' "$effective")"
          if [ "$effective_path" = "/signin" ]; then
            echo "Vercel Deployment Protection is blocking the external scheduler."
            if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
              echo "Create a Vercel Protection Bypass for Automation value and add it to GitHub as VERCEL_AUTOMATION_BYPASS_SECRET."
            else
              echo "The configured Vercel automation bypass secret was rejected or is stale."
            fi
            exit 1
          fi

          origin="$(python3 -c 'import sys; from urllib.parse import urlsplit; u=urlsplit(sys.argv[1]); assert u.scheme == "https" and u.netloc; print(f"{u.scheme}://{u.netloc}")' "$effective")"
          if [ -z "$SCHEDULER_APP_URL_OVERRIDE" ] && [ -z "$PRODUCTION_APP_URL_OVERRIDE" ]; then
            host="$(python3 -c 'import sys; from urllib.parse import urlsplit; print(urlsplit(sys.argv[1]).hostname or "")' "$origin")"
            case "$host" in
              *.vercel.app) ;;
              *) echo "Unexpected scheduler redirect host: $host"; exit 1 ;;
            esac
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ai-marketing-os-scheduler")"
          token="$(echo "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run social publisher
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SCHEDULER_ORIGIN: ${{ steps.target.outputs.origin }}
        run: |
          set -euo pipefail
          endpoint="$SCHEDULER_ORIGIN/api/scheduler/publish-social"
          headers=(-H "Authorization: Bearer $OIDC_TOKEN" -H "X-Scheduler-Source: github-actions-oidc")
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          meta="$(curl --silent --show-error --max-time 55 -o /tmp/scheduler-body -w '%{http_code}|%{url_effective}' -X POST "${headers[@]}" "$endpoint")"
          code="${meta%%|*}"
          effective="${meta#*|}"
          echo "Scheduler HTTP status: $code effective=$effective"
          cat /tmp/scheduler-body
          echo
          test "$code" = "200"
          python3 -c 'import json; data=json.load(open("/tmp/scheduler-body")); assert data.get("ok") is True; assert data.get("source") == "github-actions-oidc"'
